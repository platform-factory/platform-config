# provider-gcp-storage: Bucket, BucketIAMMember — from the C-03 kind list
# the M2 Compositions need (verified against provider-upjet-gcp v3.0.0's
# CRDs and examples, build log 2026-08-11).
#
# Wave 2: installs only after provider-family-gcp (wave 1) is Healthy.
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-gcp-storage
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  package: xpkg.crossplane.io/crossplane-contrib/provider-gcp-storage:v3.0.0
  # Pins this provider's pod to the Kubernetes service account
  # crossplane-system/provider-gcp-storage, which carries the
  # iam.gke.io/gcp-service-account annotation that makes Workload Identity
  # resolve to crossplane-provider-gcp@platform-factory-ref.iam.gserviceaccount.com.
  # Without this, the package manager names the service account after the
  # ProviderRevision and layer 0's IAM binding stops matching on every
  # version bump. See runtime-configs.yaml for the whole story; the field's
  # shape (apiVersion/kind default to pkg.crossplane.io/v1beta1 +
  # DeploymentRuntimeConfig, name required) was verified 2026-09-16 against
  # crossplane v2.3.5 cluster/crds/pkg.crossplane.io_providers.yaml.
  runtimeConfigRef:
    name: provider-gcp-storage
