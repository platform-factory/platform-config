{{- $name := .Values.metadata.name }}
{{- $project := include "system.env" (list .Values "projectID") }}
---
# The System's Google identity (ADR-0013 §1). Not durable: it goes when the
# System goes, and ADR-0018 leaves the engine permission to delete it.
apiVersion: iam.cnrm.cloud.google.com/v1beta1
kind: IAMServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ $name }}
  labels:
    {{- include "system.labels" . | nindent 4 }}
  annotations:
    {{- include "system.cnrmAnnotations" $project | nindent 4 }}
spec:
  # The account's ID in Google: <system>@<project>.iam.gserviceaccount.com.
  resourceID: {{ $name }}
  displayName: {{ printf "System %s" $name | quote }}
  description: {{ printf "Workload identity for System %s. Rendered by the platform; do not edit by hand." $name | quote }}
---
# Workload Identity: the Kubernetes service account in access.yaml may act as
# the Google one. The pool is always <project>.svc.id.goog.
apiVersion: iam.cnrm.cloud.google.com/v1beta1
kind: IAMPolicyMember
metadata:
  name: {{ $name }}-workload-identity
  namespace: {{ $name }}
  labels:
    {{- include "system.labels" . | nindent 4 }}
  annotations:
    {{- include "system.cnrmAnnotations" $project | nindent 4 }}
spec:
  resourceRef:
    kind: IAMServiceAccount
    name: {{ $name }}
  role: roles/iam.workloadIdentityUser
  member: {{ printf "serviceAccount:%s.svc.id.goog[%s/%s]" $project $name $name | quote }}
{{- /*
The Cloud SQL login grants (roles/cloudsql.client and roles/cloudsql.instanceUser,
for the System's service account and for the team's group) are not here. From
M3 they are charts/claims': one conditioned pair per database, each naming its
own instance exactly (ADR-0021 §14, C-24). Only that chart sees a claim's name.
*/}}
