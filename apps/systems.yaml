# The tenants — sync wave 4 of the root app-of-apps (ADR-0017 §3).
#
# One Application per file in the systems repo's tenants/, each rendering
# charts/system with that file. Adding a tenant is still adding one file there
# and nothing else (C-05, C-26). Under Crossplane this was an Application that
# applied the files as `System` objects; from M2b the files are read as values
# and this ApplicationSet does the fan-out.
#
# WHY SO MANY GUARDS ON ONE OBJECT. This ApplicationSet owns every tenant's
# Application, and each of those owns its tenant's namespace. By default, two
# ordinary merges would delete every tenant at once: one that removes or
# renames this file, and one that renames `tenants/` in the systems repo
# (ADR-0019, Context). The four settings below make every such merge delete
# nothing, and platform-config's CI fails if any of them goes missing:
#   1. applicationsSync: create-update — this controller creates and updates
#      Applications but never deletes one. Offboarding a tenant is therefore
#      two steps: the PR, then a person's `argocd app delete <name>-system`
#      (ADR-0019 §1). Layer 3's Argo CD sets no controller-wide policy, so this
#      field is honoured.
#   2. Prune=false,Delete=false — the root Application does not prune this
#      object when its file goes away, or delete it if the root is deleted; it
#      reports OutOfSync, which cycle.sh reads as a failed build.
#   3. its own resources finalizer — a `kubectl delete` of this object with the
#      default background cascade leaves every Application in place.
#   4. (in charts/system) Prune=false on each tenant Namespace, so a chart
#      change that stopped rendering it cannot delete it.
# A foreground delete of this object still cascades; that takes a cluster
# admin choosing it.
#
# HEALTH. An ApplicationSet's health reads its own conditions, not its
# Applications' (ADR-0017, Consequences). A healthy `systems` does not mean the
# tenants reconciled, which is why cycle.sh counts tenant Applications against
# tenant files.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: systems
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  # Go templates, and a missing field is an error rather than an empty string.
  # One malformed tenant file therefore stops generation for every tenant
  # (ADR-0017 §3); with create-update, it changes and deletes nothing either.
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/platform-factory/systems
        revision: main
        files:
          # The default globbing matches *.yaml at any depth, so a file in a
          # subfolder would become a tenant: tenants/ stays flat, and the
          # systems repo's check enforces it.
          - path: "tenants/*.yaml"
  syncPolicy:
    applicationsSync: create-update
  template:
    metadata:
      # Not the bare name: charts/system emits the tenant's own Application as
      # <name>, and an Application that rendered one of its own name would
      # overwrite itself (ADR-0017 §3).
      name: "{{ .metadata.name }}-system"
      namespace: argocd
      labels:
        platform.thecloudgeek.io/system: "{{ .metadata.name }}"
    spec:
      # The platform's project. The wall between tenant and platform is the
      # tenant's own project, which charts/system writes (ADR-0017 §3).
      project: default
      sources:
        # The chart, and this repository as a value source ($platform), both
        # at the M2b branch until it merges (ADR-0017 §12).
        - repoURL: https://github.com/platform-factory/platform-config
          targetRevision: m2b-config-connector
          path: charts/system
          ref: platform
          helm:
            # In this order, the last one winning: the tenant file, the
            # retired list, then the environment's facts, which no tenant
            # file can replace (ADR-0017 §3, §9).
            valueFiles:
              - "$systems/{{ .path.path }}/{{ .path.filename }}"
              - $systems/retired.yaml
              - $platform/environments/reference.yaml
        - repoURL: https://github.com/platform-factory/systems
          targetRevision: main
          ref: systems
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{ .metadata.name }}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - ServerSideApply=true
        retry:
          limit: 10
          backoff:
            duration: 15s
            factor: 2
            maxDuration: 5m
